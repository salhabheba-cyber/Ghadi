name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # security-events: write is only needed when GitHub Advanced Security is
      # enabled on the repository (free for public repos; requires GHAS for
      # private ones). We save the SARIF as an artifact instead so the results
      # are always available without that permission.
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          # Write the SARIF to a local file so we can upload it as an artifact.
          # This succeeds on both public and private repos regardless of GHAS.
          output: results/javascript-typescript.sarif
          # Do not try to upload to the GitHub security-events endpoint; that
          # requires GHAS on private repos and would fail with a 403.
          upload: "never"
        continue-on-error: true

      - name: Upload SARIF results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: results/
          if-no-files-found: ignore
          retention-days: 14
